name: Build VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SynapseDeck-VST3-Windows
          path: build/SynapseDeck_artefacts/Release/VST3/Synapse Deck.vst3
      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SynapseDeck-Standalone-Windows
          path: build/SynapseDeck_artefacts/Release/Standalone/Synapse Deck.exe
