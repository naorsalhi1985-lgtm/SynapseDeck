name: Build VST3 (Windows)

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2>&1 | Tee-Object -FilePath build.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Select-String -Path build.log -Pattern 'error' | Select-Object -First 8 | ForEach-Object { Write-Host ("::error::" + ($_.Line -replace '[\r\n%]',' ')) }
          }
          exit $code
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: SynapseDeck-VST3-Windows
          path: build/SynapseDeck_artefacts/Release/VST3/Synapse Deck.vst3
      - name: Upload Standalone
        uses: actions/upload-artifact@v4
        with:
          name: SynapseDeck-Standalone-Windows
          path: build/SynapseDeck_artefacts/Release/Standalone/Synapse Deck.exe
